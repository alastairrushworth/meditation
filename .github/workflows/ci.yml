name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scripts/requirements*.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements-dev.txt

      - name: Run tests
        run: python3 -m pytest
        working-directory: scripts

      # Rebuild from the committed archive: catches template and renderer
      # breakage on the pull request rather than a week later on the cron.
      - name: Rebuild the site from the archive
        run: python3 scripts/generate.py --no-fetch

      - name: Check the build produced a complete site
        run: python3 scripts/check_site.py
