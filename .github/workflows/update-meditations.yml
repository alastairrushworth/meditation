name: Update meditation list

on:
  schedule:
    # Sundays, 03:00 UTC
    - cron: '0 3 * * 0'
  workflow_dispatch:

permissions:
  contents: write

# Never let a manual run and the weekly cron rebuild the site at the same time.
concurrency:
  group: build-site
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scripts/requirements*.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements-dev.txt

      - name: Run tests
        run: python3 -m pytest
        working-directory: scripts

      # generate.py exits non-zero when too many feeds failed or the archive
      # would shrink, so a degraded build stops here instead of being published.
      - name: Rebuild the site
        run: python3 scripts/generate.py

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A -- data index.html podcasts.html sitemap.xml feed.xml \
            search-index.json assets all lengths practices teachers podcasts listen
          if git diff --staged --quiet; then
            echo "No changes to publish."
          else
            git commit -m "Update meditations — $(date -u +'%Y-%m-%d')"
            git push
          fi
